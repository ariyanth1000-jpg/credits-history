<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Credits History</title>

<style>
*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;
  overflow-x:hidden;
}

body{
  font-family:'Segoe UI',Arial,sans-serif;
  color:#0f172a;
  padding:12px;
  background:#ffffff;
}

body::before{
  content:"";
  position:fixed;
  inset:-40%;
  z-index:-2;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,0,150,.28), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(0,200,255,.28), transparent 32%),
    radial-gradient(circle at 50% 80%, rgba(34,197,94,.25), transparent 35%),
    radial-gradient(circle at 10% 90%, rgba(255,200,0,.25), transparent 30%);
  filter:blur(35px);
  animation:waterMove 10s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background:linear-gradient(120deg,rgba(255,255,255,.96),rgba(255,255,255,.72),rgba(255,255,255,.92));
  backdrop-filter:blur(10px);
}

@keyframes waterMove{
  0%{transform:translate(-4%,-3%) scale(1);}
  50%{transform:translate(4%,3%) scale(1.08) rotate(8deg);}
  100%{transform:translate(-2%,5%) scale(1.04) rotate(-6deg);}
}

.box{
  width:100%;
  max-width:920px;
  margin:28px auto 0;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(20px);
  padding:16px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 22px 55px rgba(15,23,42,.16);
}

h2{
  margin:0 0 18px;
  text-align:center;
  font-size:clamp(22px,5vw,34px);
  font-weight:900;
  color:#0f172a;
}

.subTitle{
  text-align:center;
  color:#475569;
  font-weight:700;
  font-size:clamp(13px,3vw,16px);
  margin-top:-10px;
  margin-bottom:16px;
}

.searchArea{
  margin-bottom:14px;
}

input{
  width:100%;
  padding:15px;
  font-size:clamp(17px,4vw,22px);
  font-weight:800;
  border:none;
  outline:none;
  border-radius:14px;
  background:rgba(255,255,255,.98);
  color:#0f172a;
  text-align:center;
  box-shadow:
    inset 0 0 0 1px #cbd5e1,
    0 10px 22px rgba(15,23,42,.08);
}

input:focus{
  box-shadow:
    inset 0 0 0 2px #22c55e,
    0 0 22px rgba(34,197,94,.22);
}

.resultItem{
  width:100%;
  margin-top:12px;
  padding:13px 10px;
  background:linear-gradient(135deg,#ffffff,#ecfeff,#f0fdf4);
  color:#064e3b;
  border:1px solid rgba(45,212,191,.75);
  border-radius:14px;
  font-weight:900;
  text-align:center;
  box-shadow:0 8px 20px rgba(14,165,233,.14);
  overflow:hidden;
}

.line1,
.line2{
  display:block;
  width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  line-height:1.25;
}

.line1{
  font-size:clamp(13px,3.7vw,20px);
  color:#065f46;
}

.line2{
  margin-top:5px;
  font-size:clamp(12px,3.4vw,18px);
  color:#0f766e;
}

.error{
  margin-top:14px;
  padding:14px;
  background:#fee2e2;
  color:#991b1b;
  border-radius:14px;
  text-align:center;
  font-weight:900;
  font-size:clamp(15px,4vw,20px);
  box-shadow:0 8px 18px rgba(239,68,68,.14);
}

.loading{
  margin-top:14px;
  padding:14px;
  background:#dcfce7;
  color:#166534;
  border-radius:14px;
  text-align:center;
  font-weight:900;
  font-size:clamp(15px,4vw,20px);
  box-shadow:0 8px 18px rgba(34,197,94,.14);
}

@media(max-width:420px){
  body{padding:8px;}

  .box{
    margin-top:20px;
    padding:12px;
    border-radius:16px;
  }

  .line1{
    font-size:clamp(12px,3.55vw,15px);
  }

  .line2{
    font-size:clamp(11px,3.25vw,14px);
  }
}

@media(max-width:340px){
  .line1{font-size:11px;}
  .line2{font-size:10.5px;}
}
</style>
</head>

<body>

<div class="box">

  <h2>ꕤ Credits History 🔔</h2>
  <div class="subTitle">Secure account verification required</div>

  <div class="searchArea" id="searchArea">
    <input type="text" id="studentId" placeholder="🛡️ Security Check Required">
  </div>

  <div id="result"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzBJpScRYLgV1YMTIExhdyiMQaUxcG0rjbjr5BW0fON3WKYv3Xp9LOEKUhqe8ecgQcO4Q/exec";

const studentInput = document.getElementById("studentId");
const searchArea = document.getElementById("searchArea");
const resultBox = document.getElementById("result");

let searchTimer = null;

window.onload = function(){

  const savedId = localStorage.getItem("savedStudentId");

  if(savedId){
    studentInput.value = savedId;
    autoSearch(savedId);
  }else{
    searchArea.style.display = "block";
  }
};

studentInput.addEventListener("input", function(){

  const id = studentInput.value.trim();

  localStorage.setItem("savedStudentId", id);

  clearTimeout(searchTimer);

  searchTimer = setTimeout(function(){

    if(id !== ""){
      autoSearch(id);
    }else{
      resultBox.innerHTML = "";
      searchArea.style.display = "block";
    }

  }, 500);
});

function showSearchBoxAgain(){
  searchArea.style.display = "block";
  studentInput.focus();
}

function hideSearchBox(){
  searchArea.style.display = "none";
}

function autoSearch(id){

  resultBox.innerHTML =
    '<div class="loading">Credits History Checking...</div>';

  fetch(API_URL + "?action=credits&id=" + encodeURIComponent(id))
  .then(res => res.json())
  .then(data => {

    if(!data.found){

      showSearchBoxAgain();

      resultBox.innerHTML =
        '<div class="error">⦸ Incorrect Password ⚠︎</div>';

      return;
    }

    hideSearchBox();

    if(!data.results || data.results.length === 0){

      resultBox.innerHTML =
        '<div class="error">No Credits Found</div>';

      return;
    }

    let html = "";

    data.results.forEach(item => {

      html += `
        <div class="resultItem">
          <span class="line1">
            You are credited ${item.date}
          </span>
          <span class="line2">
            ➺ ${item.value} × ${item.rate} = ${item.tk} TK | ${Number(item.usdt).toFixed(2)} $ USDT
          </span>
        </div>
      `;

    });

    resultBox.innerHTML = html;

  })
  .catch(() => {

    showSearchBoxAgain();

    resultBox.innerHTML =
      '<div class="error">Connection Error</div>';

  });
}
</script>

</body>
</html>
